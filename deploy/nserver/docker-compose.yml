services:
  cal-quickadd:
    build:
      context: ../..
      dockerfile: deploy/nserver/Dockerfile
    container_name: cal-quickadd
    # Published on 0.0.0.0 to match the existing nserver topology, where the
    # service is fronted by an external nginx-proxy + DNS record. If you tighten
    # this to 127.0.0.1, set CAL_TOKEN in .env first or front it with HTTPS auth.
    ports:
      - "8419:8419"
    volumes:
      - ./config:/config
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8419/health',timeout=3).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
